name: Release Caudate IDE (Linux & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev pkg-config fakeroot rpm dpkg-dev python3

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.0

      - name: Install dependencies
        env:
          VSCODE_SKIP_NODE_VERSION_CHECK: '1'
        run: pnpm install --frozen-lockfile

      - name: Build Linux x64 tarball and .deb package
        env:
          VSCODE_SKIP_NODE_VERSION_CHECK: '1'
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          chmod +x scripts/build-linux.sh
          ./scripts/build-linux.sh --deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caudate-linux-x64
          path: |
            ../Caudate-IDE-linux-x64.tar.gz
            .build/linux/deb/amd64/deb/*.deb

  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.0

      - name: Install dependencies
        env:
          VSCODE_SKIP_NODE_VERSION_CHECK: '1'
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64 standalone package
        env:
          VSCODE_SKIP_NODE_VERSION_CHECK: '1'
          NODE_OPTIONS: '--max-old-space-size=8192'
        shell: pwsh
        run: |
          ./scripts/build-production.ps1
          Compress-Archive -Path "..\VSCode-win32-x64\*" -DestinationPath "..\Caudate-IDE-win32-x64.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caudate-windows-x64
          path: ../Caudate-IDE-win32-x64.zip

  publish-release:
    needs: [build-linux-x64, build-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Caudate IDE ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
